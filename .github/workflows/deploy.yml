name: Deploy Vercel
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  deploy:
    # Never execute fork code with deployment secrets. CI must pass first.
    if: >-
      vars.DEPLOY_VIA_ACTIONS == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && 'production' || 'preview' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check deployment bindings
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - run: pnpm install --frozen-lockfile
      - name: Deploy production
        if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
        run: pnpm exec vercel deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Deploy pull request preview
        if: github.event.workflow_run.event == 'pull_request'
        run: pnpm exec vercel deploy --yes --token "$VERCEL_TOKEN"
